name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    # 17:45 America/New_York on weekdays. 21:45 UTC is EDT; EST runs an hour early, still after the cash close.
    - cron: "45 21 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: pip install -r requirements.txt
      - name: Build data.json only
        run: python scripts/build_snapshot.py
      - name: Commit snapshot
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git config user.name "market-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily dashboard refresh"
          git push
